<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norsk-Tyrkisk Ordbok</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 sm:p-6 flex flex-col items-center">

  <div class="w-full max-w-xl">
    <!-- Header -->
    <div class="text-center my-6">
      <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full mb-3">
        🇳🇴 Norsk ➔ 🇹🇷 Türkçe
      </span>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Norsk–Tyrkisk Ordbok</h1>
      <p class="text-xs text-slate-500 mt-1">Pedagogisk ordbok med ordklasser, eksempler og nyanser</p>
    </div>

    <!-- Search Box -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex gap-2">
      <input type="text" id="searchInput" placeholder="Skriv et norsk ord..." 
             class="flex-1 px-4 py-3 text-slate-900 bg-transparent outline-none text-base font-medium placeholder-slate-400"
             oninput="canliArama()"
             onkeypress="if(event.key === 'Enter') araKelime()">
      <button onclick="araKelime()" 
              class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition duration-200">
        Søk
      </button>
    </div>

    <!-- Norske Tegn -->
    <div class="flex items-center gap-2 mt-3 px-1">
      <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Norske tegn:</span>
      <button onclick="harfEkle('æ')" class="px-3 py-1 bg-white border border-slate-200 rounded-lg text-sm font-semibold hover:bg-slate-100 text-slate-700 shadow-sm">æ</button>
      <button onclick="harfEkle('ø')" class="px-3 py-1 bg-white border border-slate-200 rounded-lg text-sm font-semibold hover:bg-slate-100 text-slate-700 shadow-sm">ø</button>
      <button onclick="harfEkle('å')" class="px-3 py-1 bg-white border border-slate-200 rounded-lg text-sm font-semibold hover:bg-slate-100 text-slate-700 shadow-sm">å</button>
    </div>

    <!-- Sonuç Kartı -->
    <div id="resultCard" class="hidden mt-6 bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <div class="flex justify-between items-start border-b border-slate-100 pb-4">
        <div>
          <h2 id="resWord" class="text-2xl font-bold text-slate-900 capitalize"></h2>
          <span id="resClass" class="inline-block bg-slate-100 text-slate-600 text-xs font-semibold px-2 py-0.5 rounded mt-1"></span>
        </div>
        <button onclick="seslendir()" class="p-2 text-indigo-600 hover:bg-indigo-50 rounded-full transition" title="Hør uttale">
          🔊
        </button>
      </div>

      <div class="mt-4">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Tyrkisk Betydning</h3>
        <p id="resMeaning" class="text-lg font-semibold text-slate-800 mt-1"></p>
      </div>

      <div class="mt-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Eksempelsetning</h3>
        <p id="resExampleNo" class="text-sm font-medium text-slate-900 mt-1 italic"></p>
        <p id="resExampleTr" class="text-xs text-slate-500 mt-0.5"></p>
      </div>

      <div class="mt-4 text-xs text-slate-600 bg-amber-50/50 p-3 rounded-lg border border-amber-100">
        <span class="font-bold text-amber-800">💡 Pedagogisk notat:</span>
        <span id="resNote" class="text-amber-900"></span>
      </div>
    </div>

    <!-- Bulunamadı Uyarısı & Hızlı Ekleme -->
    <div id="notFoundCard" class="hidden mt-6 bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <p class="text-sm text-slate-600">Dette ordet finnes ikke i basen ennå.</p>
      <button onclick="toggleEkleForm()" class="mt-3 text-xs bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 px-3 py-1.5 rounded-lg font-medium inline-block transition">
        ➕ Bu Kelimeyi Sözlüğe Ekle
      </button>

      <!-- Manuel Ekleme Formu -->
      <div id="ekleForm" class="hidden mt-4 pt-4 border-t border-slate-100 space-y-3">
        <input type="text" id="yeniSinif" placeholder="Ordklasse (f.eks. adjektiv, verb)" class="w-full text-xs p-2.5 border rounded-lg outline-none">
        <input type="text" id="yeniAnlam" placeholder="Türkçe Anlamı" class="w-full text-xs p-2.5 border rounded-lg outline-none">
        <input type="text" id="yeniOrnekNo" placeholder="Norveççe Örnek Cümle" class="w-full text-xs p-2.5 border rounded-lg outline-none">
        <input type="text" id="yeniOrnekTr" placeholder="Örnek Cümlenin Türkçesi" class="w-full text-xs p-2.5 border rounded-lg outline-none">
        <input type="text" id="yeniNot" placeholder="Pedagojik Not (kural, ipucu)" class="w-full text-xs p-2.5 border rounded-lg outline-none">
        <button onclick="kelimeyiKaydet()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2.5 rounded-lg transition">
          Sözlüğe Kaydet
        </button>
      </div>
    </div>

    <!-- Kelime Listesi / Hafıza -->
    <div class="mt-8 bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Ord i Basen (<span id="totalWordCount">0</span>)</h3>
      </div>
      <div id="allWordList" class="flex flex-wrap gap-2 text-sm max-h-48 overflow-y-auto"></div>
    </div>
  </div>

  <script>
    // Dahili Başlangıç Veritabanı
    const varsayilanKelimeler = {
      "slurvete": {
        "ord": "slurvete",
        "ordklasse": "adjektiv",
        "betydning": "özensiz, baştan savma, dikkatsiz",
        "eksempel_no": "Det er slurvete gjort å glemme leksene sine.",
        "eksempel_tr": "Ödevlerini unutmak baştan savma bir davranıştır.",
        "pedagogisk_notat": "Hem somut işler için hem de birinin genel tavrı için sıfat olarak kullanılır. Değişmez: et slurvete arbeid."
      },
      "glede": {
        "ord": "glede",
        "ordklasse": "substantiv / verb",
        "betydning": "sevinç, neşe / sevindirmek",
        "eksempel_no": "Det er en stor glede å se elevene lykkes.",
        "eksempel_tr": "Öğrencilerin başardığını görmek büyük bir sevinçtir.",
        "pedagogisk_notat": "Å glede seg til: dört gözle beklemek (preposisjonsbruk)."
      },
      "ansvar": {
        "ord": "ansvar",
        "ordklasse": "substantiv (nøytrum)",
        "betydning": "sorumluluk",
        "eksempel_no": "Læreren har et stort ansvar for elevenes trivsel.",
        "eksempel_tr": "Öğretmenin öğrencilerin refahı için büyük bir sorumluluğu vardır.",
        "pedagogisk_notat": "Å ta ansvar for (sorumluluk almak), å ha ansvar (sorumlu olmak)."
      }
    };

    function veritabaniniAl() {
      const yerel = localStorage.getItem('statik_ordbok_db');
      if (!yerel) {
        localStorage.setItem('statik_ordbok_db', JSON.stringify(varsayilanKelimeler));
        return varsayilanKelimeler;
      }
      return JSON.parse(yerel);
    }

    function harfEkle(harf) {
      const input = document.getElementById('searchInput');
      input.value += harf;
      input.focus();
      canliArama();
    }

    function araKelime() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) return;

      const db = veritabaniniAl();
      const sonuc = db[query];

      const resCard = document.getElementById('resultCard');
      const notFoundCard = document.getElementById('notFoundCard');

      if (sonuc) {
        notFoundCard.classList.add('hidden');
        document.getElementById('resWord').innerText = sonuc.ord;
        document.getElementById('resClass').innerText = sonuc.ordklasse;
        document.getElementById('resMeaning').innerText = sonuc.betydning;
        document.getElementById('resExampleNo').innerText = sonuc.eksempel_no;
        document.getElementById('resExampleTr').innerText = sonuc.eksempel_tr;
        document.getElementById('resNote').innerText = sonuc.pedagogisk_notat;
        resCard.classList.remove('hidden');
      } else {
        resCard.classList.add('hidden');
        notFoundCard.classList.remove('hidden');
        document.getElementById('ekleForm').classList.add('hidden');
      }
    }

    function canliArama() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (query.length >= 2) {
        araKelime();
      }
    }

    function toggleEkleForm() {
      const form = document.getElementById('ekleForm');
      form.classList.toggle('hidden');
    }

    function kelimeyiKaydet() {
      const ord = document.getElementById('searchInput').value.trim().toLowerCase();
      const ordklasse = document.getElementById('yeniSinif').value.trim() || 'adjektiv/verb/substantiv';
      const betydning = document.getElementById('yeniAnlam').value.trim();
      const eksempel_no = document.getElementById('yeniOrnekNo').value.trim();
      const eksempel_tr = document.getElementById('yeniOrnekTr').value.trim();
      const pedagogisk_notat = document.getElementById('yeniNot').value.trim();

      if (!betydning) {
        alert('Lütfen en azından bir Türkçe anlam yazın.');
        return;
      }

      const db = veritabaniniAl();
      db[ord] = { ord, ordklasse, betydning, eksempel_no, eksempel_tr, pedagogisk_notat };
      localStorage.setItem('statik_ordbok_db', JSON.stringify(db));

      // Temizle ve göster
      document.getElementById('yeniSinif').value = '';
      document.getElementById('yeniAnlam').value = '';
      document.getElementById('yeniOrnekNo').value = '';
      document.getElementById('yeniOrnekTr').value = '';
      document.getElementById('yeniNot').value = '';
      
      araKelime();
      listeyiYenile();
    }

    function seslendir() {
      const word = document.getElementById('resWord').innerText;
      if (!word) return;
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'no-NO';
      window.speechSynthesis.speak(utterance);
    }

    function listeyiYenile() {
      const db = veritabaniniAl();
      const container = document.getElementById('allWordList');
      const keys = Object.keys(db);
      document.getElementById('totalWordCount').innerText = keys.length;

      container.innerHTML = keys.map(k => `
        <button onclick="document.getElementById('searchInput').value='${k}'; araKelime();" 
                class="px-2.5 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 rounded-lg text-xs font-medium transition">
          ${k}
        </button>
      `).join('');
    }

    // Başlat
    listeyiYenile();
  </script>
</body>
</html>
