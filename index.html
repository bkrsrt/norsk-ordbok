<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norsk-Tyrkisk Ordbok</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 sm:p-6 flex flex-col items-center">

  <div class="w-full max-w-xl">
    <!-- Header -->
    <div class="text-center my-6">
      <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full mb-3">
        🇳🇴 Norsk ➔ 🇹🇷 Türkçe
      </span>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Norsk–Tyrkisk Ordbok</h1>
      <p class="text-xs text-slate-500 mt-1">Pedagogisk ordbok med ordklasser, eksempler og nyanser</p>
      
      <button onclick="ayarlaAPIKey()" class="mt-3 text-xs bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200 px-3 py-1.5 rounded-full font-medium inline-flex items-center gap-1 shadow-sm transition">
        🔑 <span id="keyBtnText">API Key Ayarla</span>
      </button>
    </div>

    <!-- Search Box -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex gap-2">
      <input type="text" id="searchInput" placeholder="Skriv et norsk ord..." 
             class="flex-1 px-4 py-3 text-slate-900 bg-transparent outline-none text-base font-medium placeholder-slate-400"
             onkeypress="if(event.key === 'Enter') araKelime()">
      <button onclick="araKelime()" id="searchBtn" 
              class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition duration-200 flex items-center justify-center">
        Oversett
      </button>
    </div>

    <!-- Norske Tegn -->
    <div class="flex items-center gap-2 mt-3 px-1">
      <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Norske tegn:</span>
      <button onclick="harfEkle('æ')" class="px-3 py-1 bg-white border border-slate-200 rounded-lg text-sm font-semibold hover:bg-slate-100 text-slate-700 shadow-sm">æ</button>
      <button onclick="harfEkle('ø')" class="px-3 py-1 bg-white border border-slate-200 rounded-lg text-sm font-semibold hover:bg-slate-100 text-slate-700 shadow-sm">ø</button>
      <button onclick="harfEkle('å')" class="px-3 py-1 bg-white border border-slate-200 rounded-lg text-sm font-semibold hover:bg-slate-100 text-slate-700 shadow-sm">å</button>
    </div>

    <!-- Loading State -->
    <div id="loading" class="hidden text-center py-10">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
      <p class="text-sm font-medium text-slate-500 mt-2">Henter forklaring og eksempler...</p>
    </div>

    <!-- Result Card -->
    <div id="resultCard" class="hidden mt-6 bg-white rounded-2xl p-6 shadow-sm border border-slate-200 transition-all">
      <div class="flex justify-between items-start border-b border-slate-100 pb-4">
        <div>
          <h2 id="resWord" class="text-2xl font-bold text-slate-900 capitalize"></h2>
          <span id="resClass" class="inline-block bg-slate-100 text-slate-600 text-xs font-semibold px-2 py-0.5 rounded mt-1"></span>
        </div>
        <button onclick="seslendir()" class="p-2 text-indigo-600 hover:bg-indigo-50 rounded-full transition" title="Hør uttale">
          🔊
        </button>
      </div>

      <div class="mt-4">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Tyrkisk Betydning</h3>
        <p id="resMeaning" class="text-lg font-semibold text-slate-800 mt-1"></p>
      </div>

      <div class="mt-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Eksempelsetning</h3>
        <p id="resExampleNo" class="text-sm font-medium text-slate-900 mt-1 italic"></p>
        <p id="resExampleTr" class="text-xs text-slate-500 mt-0.5"></p>
      </div>

      <div class="mt-4 text-xs text-slate-600 bg-amber-50/50 p-3 rounded-lg border border-amber-100">
        <span class="font-bold text-amber-800">💡 Pedagogisk notat:</span>
        <span id="resNote" class="text-amber-900"></span>
      </div>
    </div>

    <!-- Error Alert -->
    <div id="errorAlert" class="hidden mt-4 p-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl"></div>

    <!-- History -->
    <div class="mt-8 bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Søkehistorikk</h3>
        <button onclick="gecmisiTemizle()" class="text-xs text-red-500 hover:underline">Tøm</button>
      </div>
      <div id="historyList" class="flex flex-wrap gap-2 text-sm">
        <span class="text-xs text-slate-400">Henüz arama yapılmadı.</span>
      </div>
    </div>
  </div>

  <script>
    function durumGuncelle() {
      const key = localStorage.getItem('norsk_ordbok_api_key');
      const btn = document.getElementById('keyBtnText');
      if (key) {
        btn.innerText = 'API Key Kayıtlı (Değiştir)';
      } else {
        btn.innerText = 'API Key Ayarla';
      }
    }

    function ayarlaAPIKey() {
      const mevcut = localStorage.getItem('norsk_ordbok_api_key') || '';
      const key = prompt('Google AI Studio API Keyinizi girin:', mevcut);
      if (key !== null && key.trim() !== '') {
        localStorage.setItem('norsk_ordbok_api_key', key.trim());
        durumGuncelle();
      }
    }

    function harfEkle(harf) {
      const input = document.getElementById('searchInput');
      input.value += harf;
      input.focus();
    }

    async function araKelime() {
      const input = document.getElementById('searchInput');
      const query = input.value.trim();
      if (!query) return;

      const apiKey = localStorage.getItem('norsk_ordbok_api_key');
      if (!apiKey) {
        alert('Lütfen önce yukarıdaki butondan API Key tanımlayın!');
        ayarlaAPIKey();
        return;
      }

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('resultCard').classList.add('hidden');
      document.getElementById('errorAlert').classList.add('hidden');

      const promptMetni = `Du er en pedagogisk ordbokassistent for norsklærere og elever.
Analyser ordet: "${query}".
Svar KUN i ren JSON-format uten markdown eller backticks:
{
  "ord": "${query}",
  "ordklasse": "substantiv/verb/adjektiv osv.",
  "betydning": "Tyrkisk oversettelse (hovedbetydning og eventuelle nyanser)",
  "eksempel_no": "En naturlig pedagogisk eksempelsetning på norsk",
  "eksempel_tr": "Eksempelsetningens tyrkiske oversettelse",
  "pedagogisk_notat": "Bøyningsmønster, preposisjonsbruk eller kulturell kontekst"
}`;

      try {
        const endpoint = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=' + encodeURIComponent(apiKey);
        
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptMetni }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message);
        }

        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const res = JSON.parse(rawText);

        document.getElementById('resWord').innerText = res.ord;
        document.getElementById('resClass').innerText = res.ordklasse;
        document.getElementById('resMeaning').innerText = res.betydning;
        document.getElementById('resExampleNo').innerText = res.eksempel_no;
        document.getElementById('resExampleTr').innerText = res.eksempel_tr;
        document.getElementById('resNote').innerText = res.pedagogisk_notat;

        document.getElementById('resultCard').classList.remove('hidden');
        gecmiseEkle(res.ord);
      } catch (err) {
        const errBox = document.getElementById('errorAlert');
        errBox.innerText = 'Hata: ' + err.message;
        errBox.classList.remove('hidden');
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function seslendir() {
      const word = document.getElementById('resWord').innerText;
      if (!word) return;
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'no-NO';
      window.speechSynthesis.speak(utterance);
    }

    function gecmiseEkle(kelime) {
      let gecmis = JSON.parse(localStorage.getItem('norsk_gecmis') || '[]');
      gecmis = gecmis.filter(k => k.toLowerCase() !== kelime.toLowerCase());
      gecmis.unshift(kelime);
      if (gecmis.length > 20) gecmis.pop();
      localStorage.setItem('norsk_gecmis', JSON.stringify(gecmis));
      gecmisGoster();
    }

    function gecmisGoster() {
      const gecmis = JSON.parse(localStorage.getItem('norsk_gecmis') || '[]');
      const container = document.getElementById('historyList');
      if (gecmis.length === 0) {
        container.innerHTML = '<span class="text-xs text-slate-400">Henüz arama yapılmadı.</span>';
        return;
      }
      container.innerHTML = gecmis.map(k => `
        <button onclick="document.getElementById('searchInput').value='${k}'; araKelime();" 
                class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition">
          ${k}
        </button>
      `).join('');
    }

    function gecmisiTemizle() {
      localStorage.removeItem('norsk_gecmis');
      gecmisGoster();
    }

    durumGuncelle();
    gecmisGoster();
  </script>
</body>
</html>
