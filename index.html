<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Norsk-Tyrkisk Ordbok</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col justify-between">

  <div class="w-full max-w-lg mx-auto px-4">
    <!-- Header -->
    <header class="pt-6 pb-4 text-center">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-100 border border-slate-200 mb-3 text-xs font-semibold text-slate-700">
        <span>🇳🇴 Norsk</span>
        <span class="text-slate-400 font-bold">➔</span>
        <span>🇹🇷 Türkçe</span>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 mb-1">Norsk-Tyrkisk Ordbok</h1>
      <p class="text-xs text-slate-500 font-medium">Pedagogisk ordbok med ordklasser, eksempler og nyanser</p>
      
      <!-- API Key Ayar Butonu -->
      <div class="mt-2">
        <button onclick="promptApiKey()" id="apiKeyBadge" class="text-[11px] px-2.5 py-0.5 rounded-full border border-slate-200 bg-white text-slate-500 hover:text-indigo-600 transition-colors">
          ⚙️ API Key Ayarla
        </button>
      </div>
    </header>

    <!-- Search Section -->
    <div class="mb-4">
      <form id="searchForm" class="relative mb-2">
        <div class="relative flex items-center shadow-lg shadow-slate-200/80 rounded-2xl bg-white border-2 border-slate-200/80 focus-within:border-indigo-600 transition-all overflow-hidden">
          <input
            id="searchInput"
            type="text"
            placeholder="Skriv et norsk ord eller uttrykk..."
            class="w-full py-3.5 pl-4 pr-10 text-slate-900 placeholder:text-slate-400 font-medium text-base focus:outline-none bg-transparent"
          />
          <button
            type="submit"
            id="submitBtn"
            class="m-1.5 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm transition-all flex items-center justify-center shrink-0 cursor-pointer shadow-md shadow-indigo-600/20"
          >
            Oversett
          </button>
        </div>
      </form>

      <!-- Norveççe Karakterler -->
      <div class="flex items-center justify-between gap-1.5 mb-3 px-1">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Norske tegn:</span>
        <div class="flex items-center gap-1.5">
          <button type="button" onclick="insertChar('æ')" class="w-8 h-8 rounded-lg bg-white border border-slate-200 font-bold text-slate-700 hover:bg-indigo-50">æ</button>
          <button type="button" onclick="insertChar('ø')" class="w-8 h-8 rounded-lg bg-white border border-slate-200 font-bold text-slate-700 hover:bg-indigo-50">ø</button>
          <button type="button" onclick="insertChar('å')" class="w-8 h-8 rounded-lg bg-white border border-slate-200 font-bold text-slate-700 hover:bg-indigo-50">å</button>
        </div>
      </div>
    </div>

    <!-- Error Area -->
    <div id="errorBox" class="hidden mb-4 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs sm:text-sm"></div>

    <!-- Result Area -->
    <div id="resultCard" class="hidden mb-6 bg-white rounded-2xl border border-slate-200 shadow-xl overflow-hidden">
      <div class="px-5 pt-5 pb-3 border-b border-slate-100 bg-slate-50/50 flex items-start justify-between">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <h2 id="resWord" class="text-2xl font-bold tracking-tight text-slate-900"></h2>
            <button onclick="speakWord()" class="p-1.5 rounded-full bg-indigo-50 text-indigo-600 hover:bg-indigo-100">
              🔊
            </button>
          </div>
          <span id="resWordClass" class="inline-block px-2.5 py-0.5 rounded-md text-xs font-semibold border bg-blue-50 text-blue-700 border-blue-200"></span>
        </div>
      </div>
      <div id="resMeanings" class="p-5 space-y-4"></div>
      <div id="resNoteBox" class="m-5 mt-0 p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-950 text-xs"></div>
    </div>

    <!-- History Area -->
    <section class="pb-12">
      <div class="bg-white rounded-2xl border border-slate-200 shadow-md p-4 mb-4">
        <div class="flex items-center justify-between mb-3 border-b pb-2">
          <span class="text-xs font-bold text-slate-700 uppercase tracking-wider">Søkehistorikk</span>
          <button onclick="clearHistory()" class="text-xs text-rose-600 hover:underline">Tøm</button>
        </div>
        <div id="historyList" class="space-y-2 text-sm"></div>
      </div>
    </section>
  </div>

  <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-200 bg-white/50">
    <p>Norsk-Tyrkisk Pedagogisk Ordbok</p>
  </footer>

  <script>
    let GEMINI_API_KEY = localStorage.getItem('GEMINI_API_KEY') || '';
    let history = JSON.parse(localStorage.getItem('nordic_dict_history') || '[]');

    function updateApiKeyBadge() {
      const btn = document.getElementById('apiKeyBadge');
      if (GEMINI_API_KEY) {
        btn.innerText = '🔑 API Key Kayıtlı (Değiştir)';
        btn.classList.add('text-emerald-600');
      } else {
        btn.innerText = '⚠️ API Key Giriniz';
        btn.classList.add('text-rose-600');
      }
    }

    function promptApiKey() {
      const key = prompt('Lütfen Google AI Studio API Keyinizi giriniz:', GEMINI_API_KEY);
      if (key !== null) {
        GEMINI_API_KEY = key.trim();
        localStorage.setItem('GEMINI_API_KEY', GEMINI_API_KEY);
        updateApiKeyBadge();
      }
    }

    function insertChar(char) {
      const input = document.getElementById('searchInput');
      input.value += char;
      input.focus();
    }

    function speakWord(text) {
      const word = text || document.getElementById('resWord').innerText;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'nb-NO';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      if (history.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-2">Henüz arama yapılmadı.</p>';
        return;
      }
      container.innerHTML = history.map((item, index) => `
        <div onclick="selectHistory(${index})" class="p-2.5 rounded-xl border border-slate-100 hover:bg-slate-50 cursor-pointer flex justify-between items-center">
          <div>
            <div class="font-bold text-slate-800 text-sm">${item.word} <span class="text-[10px] text-slate-400 font-normal">(${item.wordClass})</span></div>
            <div class="text-xs text-slate-500">${item.meanings[0]?.turkish || ''}</div>
          </div>
          <span class="text-slate-300">➔</span>
        </div>
      `).join('');
    }

    function selectHistory(index) {
      const item = history[index];
      displayResult(item);
      window.scrollTo({ top: 120, behavior: 'smooth' });
    }

    function clearHistory() {
      if (confirm('Tüm geçmişi silmek istiyor musunuz?')) {
        history = [];
        localStorage.removeItem('nordic_dict_history');
        renderHistory();
      }
    }

    function displayResult(entry) {
      document.getElementById('resWord').innerText = entry.word;
      document.getElementById('resWordClass').innerText = entry.wordClass;
      
      const meaningsContainer = document.getElementById('resMeanings');
      meaningsContainer.innerHTML = entry.meanings.map((m, idx) => `
        <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200/80">
          <div class="flex items-center gap-2 mb-2">
            <span class="w-5 h-5 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center">${idx + 1}</span>
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-900">${m.context}</span>
          </div>
          <div class="mb-2 text-sm font-semibold text-slate-900">${m.turkish}</div>
          <div class="rounded-lg bg-white p-2.5 border border-slate-200 mb-1.5 flex justify-between items-start">
            <span class="text-sm italic text-slate-800">"${m.exampleNo}"</span>
            <button onclick="speakWord('${m.exampleNo.replace(/'/g, "\\'")}')" class="text-xs text-indigo-600 pl-2">🔊</button>
          </div>
          <div class="rounded-lg bg-indigo-50/50 p-2.5 border border-indigo-100 text-xs text-slate-700">
            "${m.exampleTr}"
          </div>
        </div>
      `).join('');

      const noteBox = document.getElementById('resNoteBox');
      if (entry.note) {
        noteBox.innerHTML = `<strong>Not / Püf Noktası:</strong> ${entry.note}`;
        noteBox.classList.remove('hidden');
      } else {
        noteBox.classList.add('hidden');
      }

      document.getElementById('resultCard').classList.remove('hidden');
    }

    document.getElementById('searchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('searchInput');
      const word = input.value.trim();
      const errBox = document.getElementById('errorBox');
      const submitBtn = document.getElementById('submitBtn');

      errBox.classList.add('hidden');
      if (!word) return;

      if (!GEMINI_API_KEY) {
        promptApiKey();
        if (!GEMINI_API_KEY) return;
      }

      // Önce geçmişte var mı kontrol et
      const existing = history.find(h => h.word.toLowerCase() === word.toLowerCase());
      if (existing) {
        displayResult(existing);
        return;
      }

      submitBtn.innerText = '...';
      submitBtn.disabled = true;

      const systemPrompt = `You are an expert Norwegian-Turkish pedagogical lexicographer. Return strict JSON.
Rules:
- Identify word class accurately.
- Provide 1 to 2 distinct context meanings in Turkish.
- Provide 1 natural Norwegian example sentence with its accurate Turkish translation for each meaning.
- Add a one-line tip or grammar note (note).

JSON structure:
{
  "word": "${word}",
  "wordClass": "ordklasse",
  "meanings": [
    {
      "context": "Bağlam başlığı",
      "turkish": "Türkçe karşılıklar",
      "exampleNo": "Norveççe örnek cümle",
      "exampleTr": "Türkçe çevirisi"
    }
  ],
  "note": "Kısa püf noktası"
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Ord eller uttrykk: "${word}"` }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: { responseMimeType: "application/json", temperature: 0.2 }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const resultJson = JSON.parse(data.candidates[0].content.parts[0].text);
        displayResult(resultJson);

        // Geçmişe ekle ve kaydet
        history = [resultJson, ...history.filter(h => h.word.toLowerCase() !== resultJson.word.toLowerCase())];
        localStorage.setItem('nordic_dict_history', JSON.stringify(history));
        renderHistory();

      } catch (err) {
        errBox.innerText = 'Hata: ' + err.message;
        errBox.classList.remove('hidden');
      } finally {
        submitBtn.innerText = 'Oversett';
        submitBtn.disabled = false;
      }
    });

    updateApiKeyBadge();
    renderHistory();
  </script>
</body>
</html>
